<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain's Log — Incoming Transmission</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-bg"></div>
    <div class="radar"></div>

    <main class="hero">
        <div class="frame">
            <span class="bracket tl"></span>
            <span class="bracket tr"></span>
            <span class="bracket bl"></span>
            <span class="bracket br"></span>

            <p class="eyebrow">// incoming transmission</p>
            <h1>HAPPY BIRTHDAY<br><span>CAPTAIN</span></h1>
            <p class="subtitle" id="typewriter"></p>

            <button class="btn" id="open-log">Open the Log →</button>
            <p class="coords">LOG DATE // 19.09 &nbsp;&nbsp; STATUS // HAPPY BIRTHDAY CAPTAIN</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
