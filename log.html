<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain's Log — Entries</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="log.css">
</head>
<body>
    <div class="grid-bg"></div>

    <header class="log-header">
        <p class="eyebrow">// captain's log</p>
        <h1>ENTRIES ON FILE</h1>
        <p class="signal" id="signal">SIGNAL // 0 OF 4 DECODED</p>
    </header>

    <main class="entries" id="entries"></main>

    <div class="controls">
        <button class="btn" id="decode-btn">Decode Next Entry →</button>
    </div>

    <script src="log.js"></script>
</body>
</html>
